name: CI - Build & Scan
on:
  push:
    branches: [main]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nginx-app:latest .

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: nginx-app:latest
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USER }}" --password-stdin
          docker tag nginx-app:latest alexxxanndree/nginx-app:latest
          docker push alexxxanndree/nginx-app:latest
